quarkus.application.name=ms-ocp-tools
quarkus.http.port=8080

# Informix CMS. OpenShift inyecta estos valores desde ConfigMap y Secret.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=com.informix.jdbc.IfxDriver
quarkus.datasource.jdbc.url=${CMS_DB_JDBC_URL:jdbc:informix-sqli://localhost:1448/gescab:INFORMIXSERVER=cmt_tcp}
quarkus.datasource.username=${CMS_DB_USER:local-user}
quarkus.datasource.password=${CMS_DB_PASSWORD:local-password}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=${CMS_DB_POOL_MAX_SIZE:5}
quarkus.datasource.jdbc.acquisition-timeout=${CMS_DB_ACQUISITION_TIMEOUT:5S}
quarkus.datasource.jdbc.login-timeout=${CMS_DB_LOGIN_TIMEOUT:5S}
# El flujo de registro usa una conexión JDBC normal para marcar estado_env='P'
# después de createEsb; el permiso efectivo lo controla el usuario de Informix.
quarkus.datasource.jdbc.transactions=disabled

# Inventario de la Herramienta 02. Es un datasource independiente y opcional:
# una caída de PostgreSQL no debe sacar de servicio a la Herramienta 01.
quarkus.datasource."inventory".db-kind=postgresql
quarkus.datasource."inventory".jdbc.url=${OCP_MAP_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ocptools}
quarkus.datasource."inventory".username=${OCP_MAP_DB_USER:ocptools}
quarkus.datasource."inventory".password=${OCP_MAP_DB_PASSWORD:ocptools}
quarkus.datasource."inventory".jdbc.min-size=0
quarkus.datasource."inventory".jdbc.max-size=${OCP_MAP_DB_POOL_MAX_SIZE:5}
quarkus.datasource."inventory".jdbc.acquisition-timeout=${OCP_MAP_DB_ACQUISITION_TIMEOUT:5S}
quarkus.datasource."inventory".health-exclude=true
quarkus.flyway."inventory".locations=db/ocp-map
quarkus.flyway."inventory".migrate-at-start=false
quarkus.flyway."inventory".connect-retries=0

# Lectura secuencial de deployments: un namespace por ciclo, sin mutaciones OCP.
ocp-tools.ocp-map.namespaces=${OCP_MAP_NAMESPACES:agendador-test,diagnosticador-test,pmx-test,security-test,testing,testing-diversificacion,testing-matrix,testing-pmx1,testing-pmx2,testing-pmx3,testing-pmx4}
ocp-tools.ocp-map.visible-namespaces=${OCP_MAP_VISIBLE_NAMESPACES:}
ocp-tools.ocp-map.console-base-url=${OCP_CONSOLE_BASE_URL:https://console-openshift-console.apps.ocpnprod7.gp.inet}
ocp-tools.ocp-map.database-retry=${OCP_MAP_DB_RETRY:30S}
ocp-tools.ocp-map.scan-interval=${OCP_MAP_SCAN_INTERVAL:5s}
ocp-tools.ocp-map.scan-initial-delay=${OCP_MAP_SCAN_INITIAL_DELAY:3s}
quarkus.kubernetes-client.connection-timeout=${OCP_API_CONNECTION_TIMEOUT:5S}
quarkus.kubernetes-client.request-timeout=${OCP_API_REQUEST_TIMEOUT:5S}
quarkus.kubernetes-client.request-retry-backoff-limit=0

# Integraciones SOAP. Los endpoints efectivos se externalizan en el ConfigMap.
ocp-tools.soap.query-url=${SOAP_QUERY_URL:http://localhost:10002/Parallelism/queryESb}
ocp-tools.soap.register-url=${SOAP_REGISTER_URL:http://localhost:10002/Parallelism/createEsb}
ocp-tools.timeouts.cms-query-seconds=${CMS_QUERY_TIMEOUT_SECONDS:5}
ocp-tools.timeouts.soap-query=${SOAP_QUERY_TIMEOUT:5S}
ocp-tools.timeouts.soap-register=${SOAP_REGISTER_TIMEOUT:5S}
ocp-tools.cms.post-register-update-delay=${CMS_POST_REGISTER_UPDATE_DELAY:1S}

# Utilidad TCP. El usuario ingresa una IPv4 y un puerto; no se envía payload.
ocp-tools.tcp-check.timeout=${TCP_CHECK_TIMEOUT:10S}

# Monitoreo de servicios externos. Las dos claves llegan exclusivamente desde Secret.
# La clave de cifrado es Base64 de 32 bytes y es distinta de la clave maestra KDBX.
ocp-tools.external-monitor.enabled=${EXTERNAL_MONITOR_ENABLED:false}
# El tráfico HTTPS sigue cifrado, pero en testing se admiten certificados internos/no confiables.
ocp-tools.external-monitor.tls-verify=${EXTERNAL_MONITOR_TLS_VERIFY:false}
ocp-tools.external-monitor.interval=${EXTERNAL_MONITOR_INTERVAL:10m}
ocp-tools.external-monitor.initial-delay=${EXTERNAL_MONITOR_INITIAL_DELAY:30s}
ocp-tools.external-monitor.parallelism=${EXTERNAL_MONITOR_PARALLELISM:4}
ocp-tools.external-monitor.session-duration=${EXTERNAL_ADMIN_SESSION_DURATION:15m}
ocp-tools.external-monitor.max-unlock-failures=${EXTERNAL_ADMIN_MAX_FAILURES:5}
ocp-tools.external-monitor.unlock-window=${EXTERNAL_ADMIN_FAILURE_WINDOW:5m}
ocp-tools.external-monitor.unlock-block=${EXTERNAL_ADMIN_BLOCK_DURATION:15m}
ocp-tools.external-monitor.encryption-key=${EXTERNAL_CREDENTIAL_ENCRYPTION_KEY:}
ocp-tools.external-monitor.kdbx-master-password=${EXTERNAL_KDBX_MASTER_PASSWORD:}

# Catálogo UI -> subsistema interno.
ocp-tools.environments.pmx1=${PMX1_SUBSYSTEM:DIVPMX1}
ocp-tools.environments.pmx3=${PMX3_SUBSYSTEM:DIVPMX2}
ocp-tools.environments.pmx4=${PMX4_SUBSYSTEM:DIV01}

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Logs estructurados para OCP/New Relic.
quarkus.log.console.json.enabled=${JSON_LOGS:true}
quarkus.log.console.json.exception-output-type=detailed-and-formatted
quarkus.log.level=INFO
