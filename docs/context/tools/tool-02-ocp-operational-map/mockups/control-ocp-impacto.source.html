<div id="ocpImpactMock">

      #ocpImpactMock .im-impact-main { grid-template-columns: 1fr; }
      #ocpImpactMock .im-impact-state { padding: 8px 18px; }
      #ocpImpactMock .im-impact-test { padding: 8px 18px; }
      #ocpImpactMock .im-impact-ocp { padding: 0 18px 14px; }
    }
  </style>

  <div class="im-window">
    <header class="im-topbar">
      <div class="im-logo">OC</div>
      <div class="im-product"><small>CERTIFICACIÓN</small><strong>Mapa operativo OCP</strong></div>
      <span id="imLiveTesting" class="im-live"></span>

    <nav class="im-tabs" aria-label="Vistas principales" role="tablist">

      <button class="im-tab" type="button" role="tab" data-view="unmapped"><i data-lucide="sparkles" aria-hidden="true"></i>Sin flujo <span id="imUnmappedCount" class="im-tab-count"></span></button>
      <button class="im-tab" type="button" role="tab" data-view="impact"><i data-lucide="activity" aria-hidden="true"></i>Impacto al apagar <span id="imImpactCount" class="im-tab-count"></span></button>

    <main class="im-main">
      <div id="imHeading" class="im-heading"></div>
      <div id="imNotice" class="im-notice" role="status" aria-live="polite"></div>

      <div id="imResultsHead" class="im-results-head"></div>
      <div id="imContent" class="im-list"></div>
    </main>
  </div>

  <script>
    (() => {
      const root = document.getElementById('ocpImpactMock');
      const services = [
        { id:'scoring', ns:'testing', name:'ms-integracion-scoringburo', pods:1, testing:false, cases:['CP-001','CP-002'] },
        { id:'validate', ns:'testing-diversificacion', name:'ms-ocp-integracion-validateaddress-camel', pods:1, testing:true, testingBy:'Equipo FTTH', cases:['CP-001','CP-002','CP-003'] },
        { id:'address', ns:'testing-diversificacion', name:'ms-ocp-integracion-addressroute-camel', pods:1, testing:false, cases:['CP-001','CP-003'] },
        { id:'serviceability', ns:'testing-diversificacion', name:'ms-ocp-integracion-checkserviceabilitysystem-camel', pods:0, testing:false, cases:['CP-001','CP-002','CP-003','CP-004'] },
        { id:'availability', ns:'testing-diversificacion', name:'ms-ocp-integracion-serviceavailability-camel', pods:1, testing:false, cases:['CP-001','CP-002','CP-003'] },
        { id:'appointment', ns:'testing-diversificacion', name:'ms-ocp-integracion-retrieveavailableappointmentsv1-camel', pods:1, testing:true, testingBy:'Certificación Averías', cases:['CP-001','CP-002','CP-003','CP-005'] },
        { id:'daa', ns:'testing-diversificacion', name:'ms-ocp-integracion-designandassignresourcesv1-camel', pods:1, testing:false, cases:['CP-001','CP-002','CP-003'] },
        { id:'pangea', ns:'testing', name:'ms-integracion-geographicsitepangea-camel', pods:1, testing:false, cases:['CP-002'] },
        { id:'matrix-catalog', ns:'testing-matrix', name:'ms-ocp-integracion-matrix-productcatalog-camel', pods:1, testing:false, cases:['CP-004'] },
        { id:'matrix-status', ns:'testing-matrix', name:'ms-ocp-matrix-changeproductstatus-camel', pods:0, testing:false, cases:['CP-004'] },
        { id:'appointment-detail', ns:'testing-diversificacion', name:'ms-ocp-integracion-retrieveappointmentdetailsv1-camel', pods:1, testing:false, cases:['CP-005'] },
        { id:'repair', ns:'testing-diversificacion', name:'ms-ocp-integracion-repairandreplaceequipmentv1-camel', pods:0, testing:false, cases:['CP-005'] },
        { id:'cancel-order', ns:'testing', name:'ms-integracion-listenercancelorder', pods:1, testing:false, cases:['CP-006'] },
        { id:'cancel-ticket', ns:'testing-diversificacion', name:'ms-ocp-integracion-cancelticketevent-camel', pods:1, testing:false, cases:['CP-006'] },
        { id:'cancel-device', ns:'testing-diversificacion', name:'ms-integracion-cancelreservationofdevice-camel', pods:1, testing:false, cases:['CP-006'] },
        { id:'new-party', ns:'testing', name:'ms-ocp-integracion-notifypartyevents-camel', pods:1, testing:false, cases:[] },
        { id:'new-resource', ns:'testing', name:'ms-ocp-integracion-au-resourceorder-camel', pods:0, testing:false, cases:[] },
        { id:'new-event', ns:'testing', name:'ms-integracion-eventorchestrator', pods:1, testing:false, cases:[] },
        { id:'new-openid', ns:'testing-diversificacion', name:'ms-ocp-integracion-openid-retrieveuserprofile-camel', pods:1, testing:false, cases:[] },
        { id:'new-unified', ns:'testing-diversificacion', name:'ms-ocp-integracion-partyeventunified-camel', pods:0, testing:false, cases:[] },
        { id:'new-zero', ns:'testing-matrix', name:'ms-ocp-integracion-matrix-zerodiagnosis-camel', pods:1, testing:false, cases:[] },
        { id:'new-usage', ns:'testing-matrix', name:'ms-ocp-matrix-usageconsumption-camel', pods:1, testing:false, cases:[] },
        { id:'new-retention', ns:'testing-matrix', name:'ms-ocp-integracion-matrix-frequentretentiondiscountcaller-camel', pods:0, testing:false, cases:[] }
        ,{ id:'new-create-start', ns:'testing-diversificacion', name:'ms-ocp-integracion-createstartreqbyvaluev1-camel', pods:1, testing:false, cases:[] }
      ];
      const cases = [
        { id:'CP-001', title:'Alta producto fija FTTH monoInternet · CRM → CMS', meta:['CRM','CMS','Orden creada'], elements:['CRM','OMS','SVO','BUS','API On-premise','Agendador'], services:['scoring','validate','address','serviceability','availability','appointment','daa'] },
        { id:'CP-002', title:'Alta producto fija FTTH monoInternet · CRM → Pangea', meta:['CRM','Pangea','Orden creada'], elements:['CRM','OMS','SVO','API Azure','Pangea','Agendador'], services:['scoring','validate','serviceability','availability','appointment','daa','pangea'] },
        { id:'CP-003', title:'Alta producto fija FTTH monoInternet · DITO → CMS', meta:['DITO','CMS','Orden creada'], elements:['DITO','API On-premise','OMS','SVO','CMS'], services:['validate','address','serviceability','availability','appointment','daa'] },
        { id:'CP-004', title:'Modificación de velocidad de producto FTTH', meta:['CRM','OMS','Modificación'], elements:['CRM','OMS','API On-premise','Matrix'], services:['serviceability','matrix-catalog','matrix-status'] },
        { id:'CP-005', title:'Agendamiento de reparación de servicio fijo', meta:['Front atención','Agendador','Reparación'], elements:['Front atención','API Azure','Agendador','Workforce'], services:['appointment','appointment-detail','repair'] },
        { id:'CP-006', title:'Cancelación de orden de alta FTTH', meta:['CRM','SVO','Cancelación'], elements:['CRM','OMS','SVO','BUS'], services:['cancel-order','cancel-ticket','cancel-device'] }
      ];

      const state = { view:'impact', caseQuery:'', elementQuery:'', viewQuery:'', openCase:'CP-001', openImpact:'appointment', notice:'', focusField:null };
      const byService = id => services.find(service => service.id === id);
      const byCase = id => cases.find(item => item.id === id);
      const heading = root.querySelector('#imHeading');
      const notice = root.querySelector('#imNotice');
      const filters = root.querySelector('#imFilters');
      const resultsHead = root.querySelector('#imResultsHead');
      const content = root.querySelector('#imContent');
      const normalize = value => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
      const escapeHtml = value => String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
      const distance = (a,b) => { const t=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=0;j<=b.length;j+=1)t[0][j]=j; for(let i=1;i<=a.length;i+=1)for(let j=1;j<=b.length;j+=1)t[i][j]=Math.min(t[i-1][j]+1,t[i][j-1]+1,t[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return t[a.length][b.length]; };
      const fuzzy = (query,text) => { const q=normalize(query); if(!q)return true; const target=normalize(text); if(target.includes(q))return true; const qw=q.split(/\s+/).filter(Boolean), tw=target.split(/\s+/).filter(Boolean); return qw.every(word=>tw.some(candidate=>distance(word,candidate)<=(word.length>6?2:1))); };
      const ocpBase = 'https://console-openshift-console.apps.ocpnprod7.gp.inet';
      const ocpUrl = service => `${ocpBase}/k8s/ns/${encodeURIComponent(service.ns)}/deployments/${encodeURIComponent(service.name)}`;

      const namespace = value => `<span class="im-namespace">${escapeHtml(value)}</span>`;
      const podState = service => `<span class="im-state ${service.pods ? 'is-on' : 'is-off'}">${service.pods ? 'Encendido' : 'Apagado'}</span>`;
      const testingControl = service => `<label class="im-testing ${service.testing ? 'is-active' : ''}"><input type="checkbox" data-testing="${service.id}" ${service.testing ? 'checked' : ''}>En pruebas</label>`;
      const ocpLink = service => `<a class="im-ocp-link" href="${ocpUrl(service)}" target="_blank" rel="noopener noreferrer">Abrir OCP <i data-lucide="external-link" aria-hidden="true"></i></a>`;
      const serviceNameLink = service => `<a class="im-service-name im-service-link" href="${ocpUrl(service)}" target="_blank" rel="noopener noreferrer">${escapeHtml(service.name)}</a>`;
      const testingNote = service => service.testing ? `<small class="im-testing-note">Marcado por ${escapeHtml(service.testingBy || 'Tú')} · otros usuarios verán esta advertencia</small>` : '';
      const serviceRow = service => `<div class="im-service-row">${serviceNameLink(service)}${namespace(service.ns)}<span class="im-pods">${service.pods ? '1/1' : '0/1'}</span>${podState(service)}${testingControl(service)}${ocpLink(service)}${testingNote(service)}</div>`;

      function updateChrome() {
        root.querySelector('#imCasesCount').textContent = cases.length;
        root.querySelector('#imUnmappedCount').textContent = services.filter(service => !service.cases.length).length;
        root.querySelector('#imImpactCount').textContent = services.filter(service => service.cases.length).length;
        const testingCount = services.filter(service => service.testing).length;
        root.querySelector('#imLiveTesting').textContent = `${testingCount} ${testingCount === 1 ? 'microservicio en pruebas' : 'microservicios en pruebas'}`;
        root.querySelectorAll('.im-tab').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.view === state.view)));
      }

      function renderCases() {
        heading.innerHTML = `<div class="im-heading-copy"><p class="im-kicker">ESCENARIOS</p><h1>Casos de prueba</h1><p>Busca un escenario y consulta sus microservicios requeridos.</p></div><span class="im-mode">Acceso a OpenShift</span>`;
        filters.innerHTML = `<div class="im-filters"><label class="im-field"><span>Nombre del caso de prueba</span><span class="im-input"><i data-lucide="search" aria-hidden="true"></i><input id="imCaseQuery" type="search" value="${escapeHtml(state.caseQuery)}" placeholder="Ej. Alta FTTH"></span></label><label class="im-field"><span>Elemento o microservicio</span><span class="im-input"><i data-lucide="layers-3" aria-hidden="true"></i><input id="imElementQuery" type="search" value="${escapeHtml(state.elementQuery)}" placeholder="Ej. API Azure o validateaddress"></span></label></div>`;
        const visible = cases.filter(item => fuzzy(state.caseQuery,item.title) && fuzzy(state.elementQuery,[...item.elements,...item.services.map(id=>byService(id).name)].join(' ')));
        resultsHead.innerHTML = `<strong>Escenarios encontrados</strong><span>${visible.length} de ${cases.length}</span>`;
        content.innerHTML = visible.length ? visible.map(item => {
          const open = item.id === state.openCase;
          return `<article class="im-scenario ${open?'is-open':''}"><button class="im-scenario-trigger" type="button" data-open-case="${item.id}" aria-expanded="${open}"><span><small class="im-case-id">${item.id}</small><span class="im-case-title">${escapeHtml(item.title)}</span><span class="im-case-meta">${item.meta.map(value=>`<span>${escapeHtml(value)}</span>`).join('')}</span></span><i class="im-chevron" data-lucide="chevron-down" aria-hidden="true"></i></button><div class="im-case-detail"><div class="im-service-table"><div class="im-service-row im-service-header"><span>Microservicio</span><span>Namespace</span><span>Réplicas</span><span>Estado</span><span>En pruebas</span><span>OpenShift</span></div>${item.services.map(id=>serviceRow(byService(id))).join('')}</div></div></article>`;
        }).join('') : `<div class="im-empty">No hay coincidencias.</div>`;
        root.querySelector('#imCaseQuery').addEventListener('input', event => { state.caseQuery=event.target.value; state.focusField='case'; render(); });
        root.querySelector('#imElementQuery').addEventListener('input', event => { state.elementQuery=event.target.value; state.focusField='element'; render(); });
      }

      function renderUnmapped() {
        heading.innerHTML = `<div class="im-heading-copy"><p class="im-kicker">INVENTARIO PENDIENTE</p><h1>Microservicios sin flujo identificado</h1><p>Están en el inventario OCP, pero todavía no aparecen asociados a ningún caso de prueba.</p></div>`;
        filters.innerHTML = `<div class="im-filters is-single"><label class="im-field"><span>Buscar microservicio o namespace</span><span class="im-input"><i data-lucide="search" aria-hidden="true"></i><input id="imViewQuery" type="search" value="${escapeHtml(state.viewQuery)}" placeholder="Ej. matrix o partyevent"></span></label></div>`;
        const all = services.filter(service=>!service.cases.length);
        const visible = all.filter(service=>fuzzy(state.viewQuery,`${service.name} ${service.ns}`));
        resultsHead.innerHTML = `<strong>Pendientes de relacionar</strong><span>${visible.length} de ${all.length}</span>`;
        content.innerHTML = visible.length ? visible.map(service=>`<div class="im-unmapped-row"><div class="im-unmapped-main"><span class="im-unmapped-name">${serviceNameLink(service)}<small class="im-new-label">Sin casos asociados</small></span>${namespace(service.ns)}<span class="im-pods">${service.pods?'1/1':'0/1'}</span>${testingControl(service)}${ocpLink(service)}${testingNote(service)}</div></div>`).join('') : `<div class="im-empty">No hay coincidencias.</div>`;
        root.querySelector('#imViewQuery').addEventListener('input', event=>{state.viewQuery=event.target.value;state.focusField='view';render();});
      }

      function renderImpact() {
        heading.innerHTML = `<div class="im-heading-copy"><p class="im-kicker">ANÁLISIS INVERSO</p><h1>Impacto al apagar un microservicio</h1><p>Ordenados por la cantidad de casos de prueba que dependen de cada uno.</p></div>`;
        filters.innerHTML = `<div class="im-filters is-single"><label class="im-field"><span>Buscar microservicio o caso afectado</span><span class="im-input"><i data-lucide="search" aria-hidden="true"></i><input id="imViewQuery" type="search" value="${escapeHtml(state.viewQuery)}" placeholder="Ej. serviceability o CP-003"></span></label></div>`;
        const ranked = services.filter(service=>service.cases.length).sort((a,b)=>b.cases.length-a.cases.length || a.name.localeCompare(b.name));
        const visible = ranked.filter(service=>fuzzy(state.viewQuery,`${service.name} ${service.ns} ${service.cases.map(id=>`${id} ${byCase(id).title}`).join(' ')}`));
        resultsHead.innerHTML = `<strong>Dependencias identificadas</strong><span>${visible.length} microservicios</span>`;
        content.innerHTML = visible.length ? visible.map((service,index)=>{
          const open=service.id===state.openImpact;
          return `<article class="im-impact-row ${open?'is-open':''}"><div class="im-impact-main"><button class="im-impact-trigger" type="button" data-open-impact="${service.id}" aria-expanded="${open}"><span class="im-rank">#${index+1}</span><span class="im-service-name">${escapeHtml(service.name)}</span>${namespace(service.ns)}<span class="im-impact-count"><strong>${service.cases.length}</strong> casos</span><i class="im-chevron" data-lucide="chevron-down" aria-hidden="true"></i></button><div class="im-impact-state">${podState(service)}</div><div class="im-impact-test">${testingControl(service)}</div><div class="im-impact-ocp">${ocpLink(service)}</div></div><div class="im-impact-detail"><strong>Casos que podrían verse afectados</strong><div class="im-affected">${service.cases.map(id=>`<span>${id} · ${escapeHtml(byCase(id).title)}</span>`).join('')}</div>${service.testing?`<small class="im-testing-note">Actualmente en pruebas por ${escapeHtml(service.testingBy || 'Tú')}</small>`:''}</div></article>`;
        }).join('') : `<div class="im-empty">No hay coincidencias.</div>`;
        root.querySelector('#imViewQuery').addEventListener('input', event=>{state.viewQuery=event.target.value;state.focusField='view';render();});
      }

      function bindActions() {
        root.querySelectorAll('[data-open-case]').forEach(button=>button.addEventListener('click',()=>{state.openCase=state.openCase===button.dataset.openCase?null:button.dataset.openCase;render();}));
        root.querySelectorAll('[data-open-impact]').forEach(button=>button.addEventListener('click',()=>{state.openImpact=state.openImpact===button.dataset.openImpact?null:button.dataset.openImpact;render();}));
        root.querySelectorAll('[data-testing]').forEach(input=>input.addEventListener('change',event=>{event.stopPropagation();const service=byService(input.dataset.testing);service.testing=input.checked;service.testingBy=input.checked?'Tú · ahora':'';state.notice=input.checked?`${service.name} quedó marcado como “En pruebas”.`:`Se retiró la marca de pruebas de ${service.name}.`;render();}));
      }

      function render() {
        updateChrome();
        notice.className=`im-notice ${state.notice?'is-visible':''}`;
        notice.innerHTML=state.notice?`<i data-lucide="triangle-alert" aria-hidden="true"></i><span>${escapeHtml(state.notice)}</span>`:'';
        if(state.view==='cases')renderCases();
        if(state.view==='unmapped')renderUnmapped();
        if(state.view==='impact')renderImpact();
        bindActions();
        const focusSelectors={case:'#imCaseQuery',element:'#imElementQuery',view:'#imViewQuery'};
        const focusTarget=state.focusField?root.querySelector(focusSelectors[state.focusField]):null;
        if(focusTarget){focusTarget.focus();focusTarget.setSelectionRange(focusTarget.value.length,focusTarget.value.length);}
        state.focusField=null;
        if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});
      }

      root.querySelectorAll('.im-tab').forEach(tab=>tab.addEventListener('click',()=>{state.view=tab.dataset.view;state.viewQuery='';state.notice='';render();}));
      render();
    })();
  </script>
</div>
