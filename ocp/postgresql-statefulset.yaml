apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ms-ocp-tools-postgresql
  namespace: testing-pmx3
  labels:
    app.kubernetes.io/name: ms-ocp-tools-postgresql
    app.kubernetes.io/part-of: ocp-tools
spec:
  serviceName: ms-ocp-tools-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-ocp-tools-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-ocp-tools-postgresql
        app.kubernetes.io/part-of: ocp-tools
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql@sha256:447998f7e67e32d28249a78f2ee8565d6b6585cee435c1d607f62b3e7eaef69c
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: ms-ocp-tools-postgresql
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ms-ocp-tools-postgresql

