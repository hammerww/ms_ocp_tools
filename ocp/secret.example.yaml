# Plantilla documental. No aplicar ni versionar un archivo con credenciales reales.
apiVersion: v1
kind: Secret
metadata:
  name: tools
  namespace: testing-pmx3
  labels:
    app.kubernetes.io/name: ms-ocp-tools
type: Opaque
stringData:
  CMS_DB_USER: "REPLACE_WITH_AUTHORIZED_USER"
  CMS_DB_PASSWORD: "REPLACE_WITH_AUTHORIZED_PASSWORD"
  # Base64 de exactamente 32 bytes. Ejemplo de generación:
  # openssl rand -base64 32
  EXTERNAL_CREDENTIAL_ENCRYPTION_KEY: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  # Clave con la que se desbloquea la gestión y se abre el archivo KDBX exportado.
  EXTERNAL_KDBX_MASTER_PASSWORD: "REPLACE_WITH_STRONG_MASTER_PASSWORD"
